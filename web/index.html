<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Devi</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='white'/%3E%3Cellipse cx='11.5' cy='15' rx='2' ry='3' fill='%23121214'/%3E%3Cellipse cx='20.5' cy='15' rx='2' ry='3' fill='%23121214'/%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="top">
      <svg class="devi" id="devi" viewBox="0 0 100 100" aria-label="Devi">
        <circle class="devi-body" cx="50" cy="50" r="44" />
        <g class="devi-eyes" id="devi-eyes">
          <ellipse cx="36" cy="46" rx="6" ry="9" />
          <ellipse cx="64" cy="46" rx="6" ry="9" />
        </g>
      </svg>
      <div class="hello">
        <div class="hello-name" id="hello">Hola</div>
        <div class="hello-status"><span class="dot" id="conn-dot"></span><span id="conn">conectando…</span></div>
      </div>
      <button class="ghost" id="notif-btn" hidden>Activar avisos</button>
    </header>

    <main id="main">
      <section id="current"></section>
      <section id="queue"></section>
    </main>

    <template id="who-tpl">
      <div class="card who">
        <p class="muted">¿Quién eres?</p>
        <div class="who-list"></div>
      </div>
    </template>

    <script src="/app.js" type="module"></script>
  </body>
</html>
