[package]
name = "devi-desktop"
version = "0.3.0"
description = "Devi: la mascota que conecta las sesiones de Claude Code de un equipo"
edition = "2021"
rust-version = "1.80"

[lib]
name = "devi_desktop_lib"
# Solo escritorio: rlib basta (staticlib/cdylib son para móvil y alargan el build).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon"] }
tauri-plugin-autostart = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.7"
tauri-plugin-process = "2.4"
tauri-plugin-shell = "2.5"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "7"

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
